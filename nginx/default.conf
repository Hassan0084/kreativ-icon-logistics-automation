server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 12m;

    # Proxy API requests to the Node backend.
    # NOTE: no trailing slash on proxy_pass — with one, nginx strips the matched
    # /api/ prefix and the backend (which mounts routes at /api/*) returns 404.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy local-disk uploads. Supplier invoices are served from Supabase
    # Storage via signed URLs and do NOT travel through this path.
    location /uploads/ {
        proxy_pass http://backend:5000;
    }

    # Hashed build assets are served from local disk and cached aggressively.
    # This nginx IS the frontend container, so there is no upstream to proxy to.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
