# Netlify configuration — frontend only.
#
# The backend is an Express server holding a persistent Prisma/Postgres
# connection. Netlify cannot run it, so the API must be hosted separately
# (Render / Railway / Fly.io) and `VITE_API_URL` pointed at it in
# Netlify → Site settings → Environment variables.
#
# Set in Netlify (not in a committed file):
#   VITE_API_URL = https://<your-api-host>.onrender.com

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. Without this, any path that is not a literal file in dist/
# (i.e. /login, /supplier/invoices, /shipments) returns Netlify's
# "Page not found" instead of the app shell.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache hashed build assets aggressively; never cache index.html so a new
# deploy is picked up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
